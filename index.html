━━━━━━━━━━━━━━━━━━
📌 خامسًا: نظام قروب Work

قروب Work مخصص لتسجيل الإنذارات والتحذيرات، والأعضاء الجدد، والأعضاء الذين غادروا، وحالات التأديب أو الحظر المؤبد.

يُمنع إجراء السوالف والمحادثات الجانبية فيه منعًا باتًا.

━━━━━━━━━━━━━━━━━━
⚠️ تعليمات مهمة يجب حفظها

1. لا تنسَ تسجيل لقب العضو في قروب الألقاب.
2. لا تبدأ بمراسلة العضو على الخاص؛ اطلب منه أن يراسلك أولًا.
3. الأرقام الوهمية ممنوعة، ولا يُقبل التحايل بإرسال موقع أو غيره لتبريرها.
4. تسجيل العضو في قروب Work إلزامي، حتى لو كان عدد الأعضاء كبيرًا جدًا.
5. يُمنع إعطاء اللقب نفسه لشخصين؛ اللقب الذي يُستخدم يصبح محجوزًا لصاحبه.
6. يُمنع إعطاء الذكور ألقاب شخصيات إناث والعكس، وفق نظام النقابة.
7. إذا غادر العضو القروب الأساسي، احذف لقبه من وصف الاستقبال أو قروب الألقاب حسب النظام المتبع.

📌 ثالثًا: فتح السوالف

بعد ما يجاوب على الاستمارة، ما تكتفوش بإنكم تقولوا له نورت وتسكتوا. خذوا إجابة من إجاباته وافتحوا منها موضوعًا.

مثلًا لو ذكر أنمي بتحبوه، اسألوه عن رأيه فيه أو عن شخصيته المفضلة. ولو ذكر شخصية مختلفة عن اختياركم، افتحوا نقاشًا خفيفًا بينكم. المهم إن الكلام يكون طبيعي، مش أسئلة ورا بعضها كأنه تحقيق.

📌 رابعًا: إدخاله في جو المملكة

حاولوا تشركوا العضو في الكلام الجماعي، وتعرّفوه على باقي الأعضاء بالتدريج. لو فيه نقاش أنمي أو موضوع عام، اسألوه عن رأيه وشجعوه يشارك. ولو لقيتوه ساكت، ممكن تفتحوا موضوعًا يناسب اهتماماته بدل ما تضغطوا عليه عشان يتكلم.

📌 خامسًا: الفعاليات الجماعية

اعملوا فعاليات بسيطة يقدر العضو الجديد يشارك فيها بسهولة، مثل:

• 🎭 خمن الشخصية: وصف شخصية أنمي والباقي يحاول يعرفها.
• ⚔️ مين الأقوى؟: اختاروا شخصيتين وافتحوا نقاشًا عن مين الأقوى وليه.
• 🎬 تحدي الأنمي: كل عضو يرشح أنمي، والباقي يختاروا الأنسب للمشاهدة.
• 🎯 أسئلة سريعة: أسئلة خفيفة عن الأنمي أو اهتمامات الأعضاء.
• 👥 تحدي جماعي: قسّموا الأعضاء لفريقين وخلوهم يتنافسوا في أسئلة أو ألغاز.

مش لازم تعملوا فعالية كبيرة كل مرة؛ حتى فعالية صغيرة بمشاركة العضو الجديد ممكن تخليه يتفاعل ويتعرف على الناس أسرع.

const $=id=>document.getElementById(id),grid=$("grid"),sheet=$("sheet");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

function draw(list){
  grid.textContent="";
  $("cnt").textContent=list.length+" أقسام";
  if(!list.length){const e=document.createElement("p");e.className="empty";e.textContent="لا توجد نتائج";grid.append(e);return}
  list.forEach((s,k)=>{
    const c=document.createElement("button");c.type="button";c.className="card"+(s.w?" wide":"");c.style.setProperty("--i",k);
    const ic=document.createElement("span");ic.className="ic";ic.textContent=s.i;
    const t=document.createElement("div");t.style.position="relative";t.style.zIndex=1;t.style.flex="1";
    const n=document.createElement("div");n.className="nm";n.textContent=s.n;
    const d=document.createElement("div");d.className="ds";d.textContent=s.d;
    const g=document.createElement("span");g.className="go";g.textContent="←";
    if(s.w){t.append(n,d);c.append(ic,t,g)}else c.append(ic,n,d,g);
    c.onclick=()=>openSheet(s);grid.append(c);
  });
}

async function doCopy(v,bt,label){
  try{await navigator.clipboard.writeText(v)}catch(_){
    const ta=document.createElement("textarea");ta.value=v;ta.style.position="fixed";ta.style.opacity="0";document.body.append(ta);ta.select();
    try{document.execCommand("copy")}catch(__){}ta.remove();
  }
  bt.textContent="تم النسخ ✓";setTimeout(()=>bt.textContent=label,1600);
}
function copyBox(v){
  const e=document.createElement("div");e.className="copy";
  const pre=document.createElement("pre");pre.textContent=v;
  const bt=document.createElement("button");bt.type="button";bt.textContent="نسخ";
  bt.onclick=()=>doCopy(v,bt,"نسخ");
  e.append(pre,bt);return e;
}
const HD=/^(📌|⚠️|✅|📜|📨|✉️|⚖️)/;
function render(raw){
  const out=document.createDocumentFragment(),L=raw.split("\n");
  let list=null,kind="",i=0;
  const add=(tag,txt,cls)=>{const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=txt;out.append(e);list=null;return e};
  while(i<L.length){
    const ln=L[i++],t=ln.trim();
    if(t==="@@COPY"){const buf=[];while(i<L.length&&L[i].trim()!=="@@END")buf.push(L[i++]);i++;list=null;out.append(copyBox(buf.join("\n").trim()));continue}
    if(!t)continue;
    if(/^━+$/.test(t)){add("hr");continue}
    let m=t.match(/^(\d+)\.\s*(.*)$/),k=m?"ol":"";
    if(!m){m=t.match(/^[•🔹]\s*(.*)$/);if(m){k="ul";m=[0,"",m[1]]}}
    if(m){
      if(!list||kind!==k){list=document.createElement(k);kind=k;out.append(list)}
      const li=document.createElement("li");li.textContent=m[2];if(m[1])li.dataset.n=m[1];list.append(li);continue;
    }
    if(HD.test(t)||/^『.*』$/.test(t))add("h3",t);else add("p",t);
  }
  return out;
}
function openSheet(s){
  $("sic").textContent=s.i;$("snm").textContent=s.n.trim();
  $("tabs").style.display="none";
  const body=$("body");body.textContent="";body.scrollTop=0;body.append(render(s.t));
  const plain=s.t.replace(/^@@(COPY|END)\n?/gm,"");
  $("cpall").onclick=()=>doCopy(plain,$("cpall"),"نسخ");
  document.body.classList.add("open","lock");sheet.setAttribute("aria-hidden","false");
  $("veil").style.opacity=1;
  setTimeout(()=>$("cls").focus(),60);
}
function closeSheet(){document.body.classList.remove("open","lock");sheet.setAttribute("aria-hidden","true");$("veil").style.opacity=0}
$("cls").onclick=closeSheet;
addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

  const v=e.target.value.trim();

});

/* starfield */
const cv=$("sky"),cx=cv.getContext("2d");let W,H,st=[];
function fit(){
  const D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0);
  st=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,p:Math.random()*6.28,s:Math.random()*.002+.0008}));
}
function loop(t){
  const rgb=getComputedStyle(document.documentElement).getPropertyValue("--star").trim();
  cx.clearRect(0,0,W,H);
  for(const s of st){const a=reduce?.6:.2+.6*(.5+.5*Math.sin(t*s.s+s.p));cx.fillStyle="rgba("+rgb+","+a.toFixed(2)+")";cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);cx.fill()}
  if(!reduce)requestAnimationFrame(loop);
}
fit();addEventListener("resize",fit);requestAnimationFrame(loop);
